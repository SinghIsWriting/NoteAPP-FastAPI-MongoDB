<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <title>Add Note | FastAPI Notes App</title>
    <style>
        #btn{
            text-decoration: none;
            background-color: white;
            color: #333;
            padding: 10px;
            border-radius: 5px;
        }
        #btn:hover{
            background-color: #333;
            color: white;
        }
        #user_btn:hover{
            background-color: #333;
            color: white;
            cursor: none;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a id="btn" href="{{url_for('all_items')}}">All Notes</a>
        {% if user %}
        <a id="user_btn" href="#">{{ user.username }}</a>
        <a class="logout_btn" href="{{url_for('logout')}}">Logout</a>
        {% else %}
        <a class="login_btn" href="{{url_for('login')}}">Login</a>
        {% endif %}
    </div>
    <h1>Welcome to FastAPI Note App</h1>
    <p class="intro-para">This is a simple note saving application using FastAPI and Jinja2.</p>
    <div class="container">
        <h2>Add Your Notes</h2>
        <form action="/" method="post">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="note" name="note" required></textarea>
            </div>
            <div class="form-group checkbox">
                <input type="checkbox" id="important" name="important">
                <label for="important">Mark as Important</label>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 FastAPI Notes App</p>
    </footer>
</body>
</html>
