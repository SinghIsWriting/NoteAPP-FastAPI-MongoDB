<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <title>Add Note | FastAPI Notes App</title>
</head>
<body>
    <h1>Welcome to FastAPI Note App</h1>
    <p>This is a simple note saving application using FastAPI and Jinja2.</p>
    <div class="container">
        <h2>Add Your Notes</h2>
        <form action="/" method="post">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="note" name="note" required></textarea>
            </div>
            <div class="form-group checkbox">
                <input type="checkbox" id="important" name="important">
                <label for="important">Mark as Important</label>
            </div>
            <button type="submit">Submit</button>
        </form>
        <a class="notes_btn" href="{{url_for('all_items')}}">All Notes</a>
    </div>

    <footer>
        <p>&copy; 2025 FastAPI Notes App</p>
    </footer>
</body>
</html>
